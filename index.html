<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra cứu nhân sự</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 2rem 2rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #c9d1e8;
    }

    header p {
      font-size: 0.85rem;
      color: #5a607a;
    }

    .mode-switch {
      width: min(680px, 92vw);
      margin-top: 1.4rem;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      gap: 0.5rem;
    }

    .mode-btn {
      border: 1px solid #2a2d45;
      background: #13131f;
      color: #a8b4e8;
      border-radius: 999px;
      padding: 0.4rem 0.95rem;
      cursor: pointer;
      font-size: 0.84rem;
    }

    .mode-btn.active {
      background: #27305a;
      border-color: #3e4c85;
      color: #d4dbfa;
    }

    .panel {
      width: 100%;
      display: none;
    }

    .panel.active {
      display: block;
    }

    .search-wrapper {
      width: min(680px, 92vw);
      margin-top: 3rem;
      margin-left: auto;
      margin-right: auto;
      position: relative;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: #13131f;
      border: 1px solid #2a2d45;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      gap: 0.75rem;
      transition: border-color 0.2s;
    }

    .search-bar:focus-within {
      border-color: #4a5299;
      box-shadow: 0 0 0 3px rgba(74, 82, 153, 0.15);
    }

    #question {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e8e8f0;
      font-size: 1rem;
      caret-color: #7b88d4;
    }

    #question::placeholder { color: #3d4260; }

    #ask-btn {
      background: #2e3563;
      border: none;
      border-radius: 8px;
      padding: 0.45rem 1.1rem;
      color: #a8b4e8;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    #ask-btn:hover:not(:disabled) {
      background: #3d4a80;
      color: #d0d8f8;
    }

    #ask-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-wrapper {
      width: min(680px, 92vw);
      margin-top: 1.5rem;
      margin-bottom: 3rem;
      margin-left: auto;
      margin-right: auto;
    }

    .loader {
      display: none;
      align-items: center;
      gap: 0.75rem;
      color: #4a5299;
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    .loader.active { display: flex; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #2a2d45;
      border-top-color: #4a5299;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .answer-card {
      display: none;
      background: #13131f;
      border: 1px solid #2a2d45;
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      line-height: 1.75;
      font-size: 0.95rem;
    }

    .answer-card.visible { display: block; }

    .answer-card strong { color: #c0caee; }
    .answer-card h1, .answer-card h2, .answer-card h3 {
      color: #c0caee;
      margin: 1rem 0 0.4rem;
      font-weight: 600;
    }
    .answer-card p { margin-bottom: 0.6rem; }
    .answer-card ul, .answer-card ol {
      padding-left: 1.4rem;
      margin-bottom: 0.6rem;
    }
    .answer-card li { margin-bottom: 0.25rem; }
    .answer-card hr {
      border: none;
      border-top: 1px solid #2a2d45;
      margin: 1rem 0;
    }

    .answer-card a {
      color: #8ea4f0;
      text-decoration: none;
      border-bottom: 1px solid rgba(142, 164, 240, 0.3);
      transition: color 0.15s, border-color 0.15s;
    }

    .answer-card a:hover {
      color: #b8caff;
      border-color: rgba(184, 202, 255, 0.6);
    }

    .answer-card.error {
      border-color: #5a2a2a;
      color: #c07070;
    }

    .entity-mention {
      color: #cfd8ff;
      border-bottom: 1px dashed #5f6db0;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .entity-mention:hover {
      color: #f2f5ff;
      border-color: #9ca8e8;
    }

    .entity-popover {
      position: fixed;
      z-index: 999;
      min-width: 220px;
      max-width: 280px;
      padding: 0.7rem 0.8rem;
      border-radius: 12px;
      background: rgba(20, 26, 46, 0.74);
      border: 1px solid rgba(170, 184, 246, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(10px);
      color: #d8def9;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .entity-popover.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .entity-popover .name {
      font-size: 0.88rem;
      color: #e6ebff;
      font-weight: 600;
    }

    .entity-popover .meta {
      margin-top: 0.18rem;
      color: #aab3db;
      font-size: 0.77rem;
    }

    .entity-popover .role {
      margin-top: 0.45rem;
      font-size: 0.81rem;
      color: #c5cef1;
    }

    .explore-wrapper {
      width: min(680px, 92vw);
      margin-top: 1.2rem;
      margin-bottom: 2rem;
      margin-left: auto;
      margin-right: auto;
    }

    .explore-filter-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr;
      gap: 0.65rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .field-group label {
      font-size: 0.73rem;
      color: #8f99c3;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .explore-input,
    .explore-number {
      width: 100%;
      background: #13131f;
      border: 1px solid #2a2d45;
      border-radius: 10px;
      color: #e8e8f0;
      padding: 0.62rem 0.72rem;
      outline: none;
      font-size: 0.9rem;
    }

    .explore-input:focus,
    .explore-number:focus {
      border-color: #4a5299;
      box-shadow: 0 0 0 3px rgba(74, 82, 153, 0.15);
    }

    .explore-actions {
      margin-top: 0.7rem;
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .explore-btn {
      border: none;
      background: #2e3563;
      color: #d0d8f8;
      border-radius: 8px;
      padding: 0.48rem 0.95rem;
      cursor: pointer;
      font-size: 0.86rem;
    }

    .explore-note {
      color: #8891b9;
      font-size: 0.8rem;
    }

    .lookup-list {
      list-style: none;
      margin-top: 0.9rem;
      display: grid;
      gap: 0.6rem;
    }

    .lookup-card {
      background: #12182a;
      border: 1px solid #2c3352;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      line-height: 1.5;
      font-size: 0.86rem;
      color: #d1d8f5;
    }

    .lookup-card .title {
      color: #dbe1ff;
      font-weight: 600;
    }

    .lookup-card .meta {
      color: #8f99c3;
      font-size: 0.78rem;
      margin-top: 0.25rem;
    }

    @media (max-width: 720px) {
      .explore-filter-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Knowledge Tree ───────────────────────────────────── */
    .tree-wrapper {
      width: min(920px, 94vw);
      margin: 1.5rem auto 3rem;
    }
    .tree-search-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      align-items: center;
    }
    .tree-search-input {
      flex: 1;
      background: #13131f;
      border: 1px solid #2a2d45;
      border-radius: 10px;
      color: #e8e8f0;
      padding: 0.6rem 0.8rem;
      outline: none;
      font-size: 0.9rem;
    }
    .tree-search-input:focus { border-color: #4a5299; box-shadow: 0 0 0 3px rgba(74,82,153,0.15); }
    .tree-branch {
      margin-bottom: 0.55rem;
      background: #12131e;
      border: 1px solid #252840;
      border-radius: 12px;
      overflow: hidden;
    }
    .tree-branch-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.78rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .tree-branch-header:hover { background: #1a1d33; }
    .tree-branch-icon { font-size: 1rem; flex-shrink: 0; }
    .tree-branch-label { font-weight: 600; font-size: 0.95rem; color: #c9d1e8; flex: 1; }
    .tree-branch-count {
      background: #1e2140;
      color: #6b78b4;
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      font-size: 0.74rem;
    }
    .tree-chevron { color: #4a5299; font-size: 0.72rem; transition: transform 0.2s; flex-shrink: 0; }
    .tree-branch.open > .tree-branch-header .tree-chevron,
    .tree-l1.open > .tree-l1-header .tree-chevron { transform: rotate(90deg); }
    .tree-branch-body { display: none; border-top: 1px solid #1e2040; }
    .tree-branch.open > .tree-branch-body { display: block; }
    .tree-l1 { border-bottom: 1px solid #1a1d35; }
    .tree-l1:last-child { border-bottom: none; }
    .tree-l1-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.48rem 0.9rem 0.48rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .tree-l1-header:hover { background: #16192e; }
    .tree-l1-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .tree-l1-label { font-size: 0.87rem; color: #a8b2d8; flex: 1; font-weight: 500; }
    .tree-l1-count { color: #4a5480; font-size: 0.74rem; }
    .tree-l1-body { display: none; padding: 0.2rem 0 0.45rem 2.3rem; }
    .tree-l1.open > .tree-l1-body { display: block; }
    .tree-l2-label {
      font-size: 0.71rem;
      color: #4a5480;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.3rem 0 0.1rem;
      margin-bottom: 0.2rem;
      border-bottom: 1px solid #1e2040;
    }
    .tree-persons { display: flex; flex-direction: column; gap: 0.12rem; margin-bottom: 0.3rem; }
    .tree-person {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.3rem 0.42rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .tree-person:hover { background: #1c2038; }
    .tree-person-name { color: #c2caf0; font-size: 0.86rem; font-weight: 500; }
    .tree-person-year { color: #3d4770; font-size: 0.75rem; }

    footer {
      margin-top: auto;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: #2e3350;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tra cứu nhân sự</h1>
    <p>Hệ thống tra cứu lãnh đạo nội bộ</p>
  </header>

  <section id="ask-panel" class="panel active">
    <div class="search-wrapper">
      <div class="search-bar">
        <input id="question" type="text" autocomplete="off" spellcheck="false" />
        <button id="ask-btn">Tìm kiếm</button>
      </div>
    </div>

    <div class="result-wrapper">
      <div class="loader" id="loader">
        <div class="spinner"></div>
      </div>
      <div class="answer-card" id="answer-card"></div>
    </div>
  </section>
    <div class="tt-meta" id="tt-meta"></div>
    <div class="tt-action" id="tt-action"></div>
  </div>

  <footer>Demo - API: localhost:8000</footer>

  <script>
    const API_URL = "http://localhost:8000/search?verbose=true";
    const LOOKUP_URL = "http://localhost:8000/lookup";
    const TREE_URL = "http://localhost:8000/tree";

    const modeAsk = document.getElementById("mode-ask");
    const askPanel = document.getElementById("ask-panel");
    const input = document.getElementById("question");
    const btn = document.getElementById("ask-btn");
    const loader = document.getElementById("loader");
    const card = document.getElementById("answer-card");

    const entityPopover = document.createElement("div");
    entityPopover.className = "entity-popover";
    document.body.appendChild(entityPopover);

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function annotateAnswerEntities(rootEl, dbCandidates) {
      if (!rootEl || !Array.isArray(dbCandidates) || dbCandidates.length === 0) {
        return;
      }

      const candidates = dbCandidates
        .filter(c => c && c.name)
        .sort((a, b) => b.name.length - a.name.length);

      if (!candidates.length) {
        return;
      }

      const byName = new Map();
      candidates.forEach(c => byName.set(c.name, c));

      const nameRegex = new RegExp(`(${candidates.map(c => escapeRegExp(c.name)).join("|")})`, "g");
      const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
      const textNodes = [];

      while (walker.nextNode()) {
        const node = walker.currentNode;
        const parentTag = node.parentElement?.tagName;
        if (!node.nodeValue?.trim()) continue;
        if (["SCRIPT", "STYLE", "CODE", "PRE"].includes(parentTag)) continue;
        textNodes.push(node);
      }

      textNodes.forEach(node => {
        const text = node.nodeValue;
        nameRegex.lastIndex = 0;
        if (!nameRegex.test(text)) return;

        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        text.replace(nameRegex, (match, _g1, offset) => {
          if (offset > lastIndex) {
            fragment.appendChild(document.createTextNode(text.slice(lastIndex, offset)));
          }

          const entity = byName.get(match);
          if (entity) {
            const span = document.createElement("span");
            span.className = "entity-mention";
            span.textContent = match;
            span.dataset.name = entity.name || "Unknown";
            span.dataset.birth = entity.nam_sinh || "N/A";
            span.dataset.role = entity.chuc_vu || "N/A";
            span.dataset.score = entity.score ?? "N/A";
            fragment.appendChild(span);
          } else {
            fragment.appendChild(document.createTextNode(match));
          }

          lastIndex = offset + match.length;
          return match;
        });

        if (lastIndex < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        }

        node.parentNode.replaceChild(fragment, node);
      });
    }

    function showEntityPopover(target) {
      if (!target?.dataset) return;

      entityPopover.innerHTML = `
        <div class="name">${target.dataset.name}</div>
        <div class="meta">Nam sinh: ${target.dataset.birth} | Score: ${target.dataset.score}</div>
        <div class="role">${target.dataset.role}</div>
      `;

      const rect = target.getBoundingClientRect();
      const top = Math.max(12, rect.bottom + 10);
      const left = Math.min(window.innerWidth - 300, Math.max(12, rect.left));

      entityPopover.style.top = `${top}px`;
      entityPopover.style.left = `${left}px`;
      entityPopover.classList.add("visible");
    }

    function hideEntityPopover() {
      entityPopover.classList.remove("visible");
    }

    function renderLookupItems() {} // removed

    async function lookupProfiles() {} // removed

    async function ask() {
      const question = input.value.trim();
      if (!question) return;

      card.className = "answer-card";
      card.innerHTML = "";
      hideEntityPopover();
      loader.classList.add("active");
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }

        const data = await res.json();
        card.innerHTML = DOMPurify.sanitize(marked.parse(data.answer ?? "No result."));
        // Make links open in new tab
        card.querySelectorAll("a").forEach(a => {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });
        annotateAnswerEntities(card, data.evidence?.db_candidates || []);
        card.classList.add("visible");
      } catch (err) {
        card.innerHTML = `Connection error: ${err.message}`;
        card.classList.add("visible", "error");
      } finally {
        loader.classList.remove("active");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", ask);
    input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

    card.addEventListener("mouseover", e => {
      const mention = e.target.closest(".entity-mention");
      if (!mention) return;
      showEntityPopover(mention);
    });

    card.addEventListener("mouseout", e => {
      if (!e.target.closest(".entity-mention")) return;
      hideEntityPopover();
    });

  </script>

</body>
</html>
